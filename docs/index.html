<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Transcript Extractor (GitHub Pages Frontend)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>YouTube Transcript Extractor</h1>
      <p class="subtitle">GitHub Pagesで動く静的フロント + APIバックエンド構成</p>

      <section class="card">
        <label for="apiBase">API Base URL</label>
        <input id="apiBase" type="text" placeholder="https://your-api.example.com" />

        <label for="videoInput">YouTube URL または動画ID</label>
        <input id="videoInput" type="text" placeholder="https://www.youtube.com/watch?v=..." />

        <button id="extractBtn" type="button">Transcriptを取得</button>
      </section>

      <section id="errorBox" class="card error hidden"></section>

      <section id="resultBox" class="card hidden">
        <h2>Transcript (English)</h2>
        <textarea id="transcriptText" readonly></textarea>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
